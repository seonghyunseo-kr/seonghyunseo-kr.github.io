landing:
  intro: >-
    I'm SeongHyun Kristine Seo, a researcher at LG Energy Solution working on diagnostic algorithms for EV battery fleets.
    My research interest is forecasting and decision-making under uncertainty in real-world industrial systems:
    how to forecast the state of complex systems, how far to trust those forecasts, and how to turn them into decisions when failure labels are scarce and arrive late.
  intro_kr: >-
    저는 LG에너지솔루션에서 EV 배터리 플릿(fleet)을 위한 진단 알고리즘을 연구하고 있는 SeongHyun Kristine Seo입니다.
    제 연구 관심사는 실제 산업 시스템에서의 불확실성 하 예측과 의사결정입니다.
    복잡한 시스템의 상태를 어떻게 예측할지, 그 예측을 어디까지 신뢰할 수 있을지, 그리고 고장 라벨이 부족하고 늦게 확보되는 상황에서 예측을 어떻게 의사결정으로 연결할지를 연구합니다.

  research_interests_label:
    en: "Research interests:"
    kr: "연구 관심분야:"
  research_interest_1:
    en: "Uncertainty-aware time-series forecasting"
    kr: "불확실성을 고려한 시계열 예측"
  research_interest_2:
    en: "Learning with scarce and delayed labels"
    kr: "라벨이 부족하고 늦게 확보되는 환경에서의 학습"
  research_interest_3:
    en: "Decision-making under uncertainty"
    kr: "불확실성 하에서의 의사결정"
  research_interest_4:
