landing:
  intro: >-
    I'm an aspiring AI/ML researcher grounded in scientific and statistical reasoning, focused on extracting insights from real-world data.
    My goal is to build reliable, data-driven systems for industrial applications that support sustainable and autonomous AI—especially in manufacturing.
    I'm particularly interested in quality and process control and automation across steel, chemical materials, and aerospace production.
  intro_kr: >-
    저는 과학적·통계적 사고에 기반해 실제 데이터에서 인사이트를 도출하는 데 집중하는 AI/ML 연구자를 꿈꾸고 있습니다.
    제 목표는 산업 현장, 특히 제조업에서 지속 가능하고 자율적인 AI를 지원하는 신뢰성 있는 데이터 기반 시스템을 구축하는 것입니다.
    철강, 화학 소재, 항공우주 생산 전반에 걸친 품질 및 공정 관리·자동화에 특히 관심이 많습니다.

